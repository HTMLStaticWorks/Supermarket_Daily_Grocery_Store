<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubyBasket | Home</title>
    <meta name="description" content="Your premium neighborhood supermarket and online grocery ordering platform.">
    
    <!-- Bootstrap 5 CSS -->
    <link id="bs-style" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', 'ar');
            document.getElementById('bs-style').href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
            const rtlCss = document.createElement('link');
            rtlCss.rel = 'stylesheet';
            rtlCss.href = 'assets/css/rtl.css';
            rtlCss.id = 'custom-rtl-css';
            document.head.appendChild(rtlCss);
        }
    </script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
