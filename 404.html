<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubyBasket | 404 Not Found</title>
    <link id="bs-style" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', 'ar');
            document.getElementById('bs-style').href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
            const rtlCss = document.createElement('link');
            rtlCss.rel = 'stylesheet';
            rtlCss.href = 'assets/css/rtl.css';
            rtlCss.id = 'custom-rtl-css';
            document.head.appendChild(rtlCss);
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-body) 100%);
        }
        
        .empty-cart-animation {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom scrolled">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2"><path d="M4 7H20L18.5 21H5.5L4 7Z" fill="var(--color-primary)" fill-opacity="0.2" stroke="var(--color-primary)" stroke-width="2" stroke-linejoin="round"/><path d="M8 7L12 3L16 7" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="14" r="3" fill="var(--color-secondary)"/></svg>
                <span>RubyBasket</span>
            </a>
            <div class="nav-controls ms-auto d-flex align-items-center gap-2">
                <button class="nav-icon-btn theme-toggle"><i data-lucide="moon"></i></button>
                <button class="nav-icon-btn rtl-toggle"><i data-lucide="arrow-left-right"></i></button>
                <a href="login.html" class="btn-primary-custom ms-2 px-3 py-1.5" aria-label="Login">Login</a>
            </div>
        </div>
    </nav>

    <!-- MAIN CREATIVE 404 SECTION -->
    <main class="error-section text-center pt-5">
        <div class="container">
            <div class="empty-cart-animation mb-5">
                <i data-lucide="shopping-cart" size="120" class="text-primary floating-element" style="animation-duration: 4s;"></i>
                <i data-lucide="search" size="40" class="text-accent position-absolute" style="top: 20px; inset-inline-end: 20px; opacity: 0.5; animation: float 3s ease-in-out infinite alternate;"></i>
                <i data-lucide="package-open" size="30" class="text-muted position-absolute" style="bottom: 20px; inset-inline-start: 20px; opacity: 0.5;"></i>
            </div>
            
            <h1 class="display-3 fw-bold mb-3 font-display">404</h1>
            <h2 class="mb-4">Looks Like This Aisle Is Empty.</h2>
            <p class="lead text-muted mb-5 max-w-md mx-auto" style="max-width: 500px;">We searched every shelf, but the page you are looking for is missing or has been moved.</p>
            
            <div class="d-flex flex-wrap justify-content-center gap-3">
                <a href="index.html" class="btn-primary-custom px-5">Back Home</a>
                <a href="index.html" class="btn-outline-custom px-5">Continue Shopping</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
