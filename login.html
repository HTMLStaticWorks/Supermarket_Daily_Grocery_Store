<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RubyBasket | Login</title>
    <link id="bs-style" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        if (localStorage.getItem('dir') === 'rtl') {
            document.documentElement.setAttribute('dir', 'rtl');
            document.documentElement.setAttribute('lang', 'ar');
            document.getElementById('bs-style').href = "https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css";
            const rtlCss = document.createElement('link');
            rtlCss.rel = 'stylesheet';
            rtlCss.href = 'assets/css/rtl.css';
            rtlCss.id = 'custom-rtl-css';
            document.head.appendChild(rtlCss);
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        .auth-bg {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: radial-gradient(circle at center, var(--bg-surface) 0%, var(--bg-body) 100%);
            overflow: hidden;
            padding: 1rem;
        }
        @media (min-width: 768px) {
            .auth-bg {
                padding: 2rem;
            }
        }
        
        .auth-card {
            width: 100%;
            max-width: 450px;
            z-index: 10;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
    <div class="auth-bg">
        <!-- 3D Grocery Environment Background -->
        <div class="position-absolute w-100 h-100 top-0 start-0 z-0 opacity-50" style="pointer-events: none;">
            <i data-lucide="shopping-bag" class="floating-element position-absolute text-primary" size="80" style="top: 15%; inset-inline-start: 15%; opacity: 0.2; animation-duration: 8s;"></i>
            <i data-lucide="apple" class="floating-element position-absolute text-danger" size="60" style="bottom: 20%; inset-inline-start: 25%; opacity: 0.2; animation-delay: 1s;"></i>
            <i data-lucide="shopping-cart" class="floating-element position-absolute text-primary" size="100" style="top: 25%; inset-inline-end: 15%; opacity: 0.15; animation-delay: 2s; animation-duration: 9s;"></i>
            <i data-lucide="package" class="floating-element position-absolute text-accent" size="70" style="bottom: 15%; inset-inline-end: 20%; opacity: 0.2; animation-delay: 0.5s;"></i>
        </div>

        <!-- ONLY ONE MAIN CARD SECTION -->
        <div class="glass-panel auth-card p-3 p-md-5 rounded-4 shadow-lg text-center position-relative">
            <!-- Theme/RTL overrides moved here -->
            <div class="d-flex justify-content-end gap-2 mb-3 d-md-none">
                <button class="nav-icon-btn theme-toggle glass-panel border-0 shadow-sm"><i data-lucide="moon"></i></button>
                <button class="nav-icon-btn rtl-toggle glass-panel border-0 shadow-sm"><i data-lucide="arrow-left-right"></i></button>
            </div>
            
            <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none mb-4 text-dark">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2"><path d="M4 7H20L18.5 21H5.5L4 7Z" fill="var(--color-primary)" fill-opacity="0.2" stroke="var(--color-primary)" stroke-width="2" stroke-linejoin="round"/><path d="M8 7L12 3L16 7" stroke="var(--color-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="14" r="3" fill="var(--color-secondary)"/></svg>
                <span class="fs-4 fw-bold font-display" style="color: var(--color-text-main)">RubyBasket</span>
            </a>
            
            <h4 class="fw-bold mb-1">Welcome Back</h4>
            <p class="text-muted small mb-4">Log in to manage your orders and lists.</p>
            
            <form id="loginForm" class="text-start" novalidate>
                <div class="mb-3 position-relative">
                    <label for="email" class="form-label small text-muted">Email or Mobile</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light"><i data-lucide="user" size="18"></i></span>
                        <input type="text" class="form-control bg-light py-2" id="email" required>
                        <div class="invalid-feedback">Please enter your email or mobile.</div>
                    </div>
                </div>
                
                <div class="mb-3 position-relative">
                    <label for="password" class="form-label small text-muted mb-1">Password</label>
                    <div class="input-group has-validation">
                        <span class="input-group-text bg-light"><i data-lucide="lock" size="18"></i></span>
                        <input type="password" class="form-control bg-light py-2" id="password" required>
                        <span class="input-group-text bg-light" style="cursor: pointer;" onclick="togglePassword('password', this)"><i data-lucide="eye" size="18"></i></span>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                </div>
                
                <div class="mb-4 d-flex justify-content-between align-items-center">
                    <div class="form-check mb-0">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label small text-muted" for="rememberMe">Remember Me</label>
                    </div>
                    <a href="#" class="small text-primary text-decoration-none">Forgot Password?</a>
                </div>
                
                <button type="submit" class="btn-primary-custom w-100 py-2 mb-3">Login</button>
                
                <button type="button" class="btn-outline-custom w-100 py-2 mb-3 d-flex align-items-center justify-content-center gap-2">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" width="18">
                    Continue with Google
                </button>
                
                <button type="button" class="btn-outline-custom w-100 py-2 mb-4 d-flex align-items-center justify-content-center gap-2">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/f/fa/Apple_logo_black.svg" alt="Apple" width="18" class="apple-icon">
                    Continue with Apple
                </button>
                
                <p class="text-muted small mb-0 text-center">Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create Account</a></p>
            </form>
        </div>
    </div>

    <!-- Theme/RTL overrides for auth page (Desktop only) -->
    <div class="position-absolute top-0 end-0 p-3 z-3 d-none d-md-flex gap-2">
        <button class="nav-icon-btn theme-toggle glass-panel border-0 shadow-sm"><i data-lucide="moon"></i></button>
        <button class="nav-icon-btn rtl-toggle glass-panel border-0 shadow-sm"><i data-lucide="arrow-left-right"></i></button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script>
        (function () {
            'use strict'
            var form = document.getElementById('loginForm')
            form.addEventListener('submit', function (event) {
                if (!form.checkValidity()) {
                    event.preventDefault()
                    event.stopPropagation()
                } else {
                    event.preventDefault();
                    // Mock login
                    window.location.href = 'dashboard.html';
                }
                form.classList.add('was-validated')
            }, false)
        })()

        function togglePassword(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconSpan.innerHTML = '<i data-lucide="eye-off" size="18"></i>';
            } else {
                input.type = 'password';
                iconSpan.innerHTML = '<i data-lucide="eye" size="18"></i>';
            }
            lucide.createIcons();
        }
    </script>
</body>
</html>
